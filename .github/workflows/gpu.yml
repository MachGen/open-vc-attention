name: Manual Blackwell validation
on: workflow_dispatch
permissions:
  contents: read
jobs:
  gpu:
    runs-on: [self-hosted, linux, x64, blackwell]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -e '.[dev]' -c requirements-tested.txt
      - run: open-vc-attn-check --smoke
      - run: python -m pytest tests/gpu
      - run: OPEN_VC_ATTN_TEST_LARGE=1 python -m pytest tests/gpu -m large
      - run: open-vc-attn-bench --preset smoke --output results/ci-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: blackwell-measurements
          path: results/*.json
