name: CPU contracts and source distribution
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install 'setuptools>=77' wheel build pytest ruff
      - run: python -m pip install --no-deps -e . -c requirements-tested.txt
      - run: ruff check src/vc_attn tests tools examples
      - run: ruff format --check src/vc_attn tests tools examples
      - run: python -m pytest tests/cpu
      - run: python tools/audit_release.py
      - run: python -m build
