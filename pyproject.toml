[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-vc-attn"
version = "0.3.0"
description = "Open-VC Attn: FP8 ExpCast attention for NVIDIA Blackwell GPUs"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE", "AUTHORS", "NOTICE", "LICENSES/*.txt"]
authors = [{name = "MachGen AI"}]
dependencies = [
  "torch>=2.9", "nvidia-cutlass-dsl[cu13]==4.6.2", "quack-kernels[cu13]==0.6.4",
  "flash-attn-4==4.0.0b33",
  "cuda-python>=12.6", "triton>=3.5.1", "einops", "typing_extensions",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "build"]
report = ["numpy", "matplotlib>=3.9", "ml_dtypes", "pypdfium2"]

[project.scripts]
open-vc-attn-bench = "open_vc_attn.cli.bench:main"
open-vc-attn-info = "open_vc_attn.cli.info:main"
open-vc-attn-check = "open_vc_attn.cli.check:main"
open-vc-attn-report = "open_vc_attn.benchmarking.report:main"

[project.urls]
Repository = "https://github.com/MachGen/open-vc-attention"
Issues = "https://github.com/MachGen/open-vc-attention/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
open_vc_attn = ["README.md", "**/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a Blackwell GPU with verified ownership", "large: exercises the integrated large-sequence pipeline"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["src/open_vc_attn/_kernels", "src/open_vc_attn/quantization.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
